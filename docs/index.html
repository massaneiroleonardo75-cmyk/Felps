<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Notas fiscais, preço de venda e encomendas dos clientes, com aviso pronto no WhatsApp.">
<meta name="theme-color" content="#0f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notas do Giba">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<title>Notas do Giba</title>
<style>
:root {
  --wa-bolha: #e7ffdb;
  --wa-bolha-texto: #111b21;
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #f8faf9;
  --border: #e3e8e6;
  --border-strong: #cfd7d4;
  --text: #15201c;
  --text-2: #4d5b56;
  --text-3: #7b8984;
  --brand: #0f7a5c;
  --brand-hover: #0b6249;
  --brand-soft: #e5f4ee;
  --brand-ink: #0a5a43;
  --accent: #1f6feb;
  --wa: #1fa855;
  --wa-hover: #188a45;
  --warn: #b45309;
  --warn-soft: #fff4e0;
  --danger: #c2341f;
  --danger-soft: #fdecea;
  --info-soft: #e8f0fe;
  --shadow: 0 1px 2px rgba(16, 24, 20, 0.05), 0 2px 8px rgba(16, 24, 20, 0.04);
  --shadow-lg: 0 12px 40px rgba(16, 24, 20, 0.18);
  --radius: 14px;
  --radius-sm: 10px;
  --sidebar: 248px;
  --bottom: 68px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wa-bolha: #144d37;
    --wa-bolha-texto: #e9edef;
    --bg: #0e1412;
    --surface: #161e1b;
    --surface-2: #1b2521;
    --border: #26322e;
    --border-strong: #34433e;
    --text: #e8efec;
    --text-2: #a9b8b2;
    --text-3: #7d8d87;
    --brand: #2bb386;
    --brand-hover: #3cc896;
    --brand-soft: #143229;
    --brand-ink: #7fe0bd;
    --wa: #25c264;
    --wa-hover: #2fd572;
    --warn: #f0a94a;
    --warn-soft: #33270f;
    --danger: #ff7a66;
    --danger-soft: #3a1a15;
    --info-soft: #172338;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --wa-bolha: #144d37;
    --wa-bolha-texto: #e9edef;
    --bg: #0e1412;
    --surface: #161e1b;
    --surface-2: #1b2521;
    --border: #26322e;
    --border-strong: #34433e;
    --text: #e8efec;
    --text-2: #a9b8b2;
    --text-3: #7d8d87;
    --brand: #2bb386;
    --brand-hover: #3cc896;
    --brand-soft: #143229;
    --brand-ink: #7fe0bd;
    --wa: #25c264;
    --wa-hover: #2fd572;
    --warn: #f0a94a;
    --warn-soft: #33270f;
    --danger: #ff7a66;
    --danger-soft: #3a1a15;
    --info-soft: #172338;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 750; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; color: var(--text-3); }

svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }

/* ---------- layout ---------- */
.app { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px; gap: 4px; z-index: 20;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 750; font-size: 17px; color: var(--text); }
.logo .marca {
  width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 16px;
}
.logo small { display: block; font-weight: 500; font-size: 12px; color: var(--text-3); }
.nav-link {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
  color: var(--text-2); font-weight: 550; text-decoration: none !important;
}
.nav-link:hover { background: var(--surface-2); color: var(--text); }
.nav-link.ativo { background: var(--brand-soft); color: var(--brand-ink); }
.nav-link .badge { margin-left: auto; }
.sidebar .cta { margin: 6px 0 14px; }
.sidebar .rodape { margin-top: auto; padding: 10px 12px; }

.main { margin-left: var(--sidebar); padding-block: 28px 48px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.conteudo { max-width: 1180px; margin: 0 auto; }

.topo-mobile, .bottom-nav { display: none; }

@media (max-width: 899px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding-block: 12px calc(var(--bottom) + 28px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topo-mobile {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid transparent;
  }
  .topo-mobile.sombra { border-bottom-color: var(--border); }
  .topo-mobile .logo { padding: 0; font-size: 16px; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    position: fixed; inset: auto 0 0 0; z-index: 30;
    height: calc(var(--bottom) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .bottom-nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    height: var(--bottom); color: var(--text-3); font-size: 11px; font-weight: 600; text-decoration: none; position: relative;
  }
  .bottom-nav a.ativo { color: var(--brand); }
  .bottom-nav a .badge { position: absolute; top: 6px; left: calc(50% + 6px); }
  .bottom-nav .camera {
    width: 58px; height: 58px; border-radius: 50%; background: var(--brand); color: #fff;
    display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px rgba(15, 122, 92, 0.4);
    border: 4px solid var(--bg);
  }
  .bottom-nav .camera svg { width: 26px; height: 26px; }
  h1 { font-size: 22px; }
}

/* ---------- componentes ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card.pad { padding: 18px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.card-body { padding: 16px 18px; }
.secao { margin-top: 24px; }
.secao > .titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 14px; }
.grid.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.duas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1050px) { .grid.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grid.duas { grid-template-columns: 1fr; } }
.linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.linha.entre { justify-content: space-between; }
.pilha { display: flex; flex-direction: column; gap: 10px; }
.cresce { flex: 1; min-width: 0; }

.cabecalho { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.cabecalho .sub { color: var(--text-2); margin-top: 4px; }
.voltar { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-weight: 550; margin-bottom: 10px; font-size: 14px; }

.kpi { padding: 16px 18px; }
.kpi .rotulo { font-size: 13px; color: var(--text-2); font-weight: 550; display: flex; align-items: center; gap: 6px; }
.kpi .valor { font-size: 24px; font-weight: 750; margin-top: 6px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .det { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
.kpi.destaque { background: var(--brand); border-color: var(--brand); color: #fff; }
.kpi.destaque .rotulo, .kpi.destaque .det { color: rgba(255, 255, 255, 0.85); }
@media (max-width: 899px) { .kpi .valor { font-size: 20px; } .kpi { padding: 14px; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); font: inherit; font-weight: 600; font-size: 14.5px;
  cursor: pointer; white-space: nowrap; text-decoration: none !important; transition: background 0.12s, border-color 0.12s, transform 0.05s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primario { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primario:hover { background: var(--brand-hover); }
.btn.wa { background: var(--wa); border-color: var(--wa); color: #fff; }
.btn.wa:hover { background: var(--wa-hover); }
.btn.perigo { color: var(--danger); }
.btn.perigo:hover { background: var(--danger-soft); }
.btn.fantasma { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.fantasma:hover { background: var(--surface-2); color: var(--text); }
.btn.grande { height: 52px; font-size: 16px; padding: 0 22px; border-radius: 12px; }
.btn.peq { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; gap: 6px; }
.btn.icone { width: 36px; padding: 0; height: 36px; }
.btn.bloco { width: 100%; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 12px; font-weight: 650; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap;
}
.badge.num-alerta { background: var(--danger); color: #fff; border: 0; min-width: 18px; height: 18px; padding: 0 5px; font-size: 11px; justify-content: center; }
.st-aguardando { background: var(--surface-2); color: var(--text-2); }
.st-chegou { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.st-avisado { background: var(--info-soft); color: var(--accent); border-color: transparent; }
.st-entregue { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.st-cancelada { background: var(--danger-soft); color: var(--danger); border-color: transparent; text-decoration: line-through; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface);
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap;
}
.chip.ativo { background: var(--text); border-color: var(--text); color: var(--surface); }
.chips.rolagem { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
.chips.rolagem::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .chips.rolagem { margin: 0; padding: 0; flex-wrap: wrap; } }

/* formulários */
label.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--text-2); }
input, select, textarea {
  font: inherit; font-size: 15px; color: var(--text); background: var(--surface);
  border: 1px solid var(--border-strong); border-radius: 10px; padding: 0 12px; height: 42px; width: 100%;
  transition: border-color 0.12s, box-shadow 0.12s;
}
textarea { padding: 10px 12px; height: auto; min-height: 90px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input[type='checkbox'] { width: 18px; height: 18px; accent-color: var(--brand); }
.input-sufixo { position: relative; display: flex; align-items: center; }
.input-sufixo input { padding-right: 30px; }
.input-sufixo span { position: absolute; right: 10px; color: var(--text-3); font-weight: 600; pointer-events: none; }
.input-prefixo { position: relative; display: flex; align-items: center; }
.input-prefixo input { padding-left: 34px; }
.input-prefixo span { position: absolute; left: 10px; color: var(--text-3); font-weight: 600; font-size: 13px; pointer-events: none; }
.busca { position: relative; flex: 1; min-width: 200px; max-width: 420px; }
.busca input { padding-left: 38px; }
.busca svg { position: absolute; left: 11px; top: 11px; color: var(--text-3); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .inteiro { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 10px; font-weight: 550; color: var(--text); cursor: pointer; }

/* listas */
.lista > * + * { border-top: 1px solid var(--border); }
.lista-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; color: inherit; text-decoration: none !important; }
a.lista-item:hover { background: var(--surface-2); }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand-ink); font-weight: 750; font-size: 15px;
}
.vazio { text-align: center; padding: 40px 20px; color: var(--text-2); }
.vazio svg { width: 40px; height: 40px; color: var(--text-3); margin-bottom: 8px; }
.vazio h3 { color: var(--text); margin-bottom: 4px; }

table.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-3); padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.tabela td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tabela tr:last-child td { border-bottom: 0; }
.tabela .dir { text-align: right; }
.tabela tbody tr.clicavel { cursor: pointer; }
.tabela tbody tr.clicavel:hover { background: var(--surface-2); }
.rolagem-x { overflow-x: auto; }

/* boas-vindas */
.saudacao { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; }
.saudacao h1 { font-size: 30px; }
.saudacao .sub { color: var(--text-2); margin-top: 4px; font-size: 15.5px; }
@media (max-width: 899px) { .saudacao h1 { font-size: 24px; } .saudacao { margin-bottom: 16px; } }
.cta-foto {
  display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--brand), #13916c); color: #fff; text-decoration: none !important; box-shadow: var(--shadow);
}
.cta-foto .ic { width: 52px; height: 52px; border-radius: 14px; background: rgba(255, 255, 255, 0.18); display: grid; place-items: center; flex: none; }
.cta-foto .ic svg { width: 28px; height: 28px; }
.cta-foto strong { display: block; font-size: 17px; }
.cta-foto span { opacity: 0.88; font-size: 14px; }

/* avisar clientes */
.aviso-cliente { display: flex; gap: 14px; padding: 16px 18px; align-items: flex-start; }
.aviso-cliente .itens { margin: 6px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--text-2); }
.aviso-cliente .itens li { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.aviso-cliente .acoes { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
@media (max-width: 640px) {
  .aviso-cliente { flex-wrap: wrap; }
  .aviso-cliente .acoes { flex-direction: row; width: 100%; }
  .aviso-cliente .acoes .btn { flex: 1; }
}

/* gráfico */
.grafico { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; height: 170px; padding-top: 10px; }
.grafico .col { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.grafico .barras { display: flex; gap: 4px; align-items: flex-end; height: 100%; width: 100%; justify-content: center; }
.grafico .b { width: 40%; max-width: 22px; border-radius: 5px 5px 2px 2px; min-height: 2px; }
.grafico .b.inv { background: var(--border-strong); }
.grafico .b.ven { background: var(--brand); }
.grafico .mes { font-size: 12px; color: var(--text-3); font-weight: 600; text-transform: capitalize; }
.legenda { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-2); }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* enviar nota */
.zona-envio {
  border: 2px dashed var(--border-strong); border-radius: var(--radius); background: var(--surface);
  padding: 32px 20px; text-align: center; transition: border-color 0.15s, background 0.15s;
}
.zona-envio.arrastando { border-color: var(--brand); background: var(--brand-soft); }
.zona-envio .ic-grande { width: 64px; height: 64px; border-radius: 18px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin: 0 auto 14px; }
.zona-envio .ic-grande svg { width: 32px; height: 32px; }
.zona-envio .botoes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
@media (max-width: 640px) { .zona-envio .botoes { flex-direction: column; } .zona-envio .botoes .btn { width: 100%; } }
.miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }
.mini { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; }
.mini img { width: 100%; height: 100%; object-fit: cover; }
.mini .tipo { font-weight: 800; font-size: 18px; color: var(--text-2); text-align: center; padding: 8px; word-break: break-all; }
.mini .tipo small { display: block; font-weight: 500; font-size: 11px; margin-top: 4px; }
.mini .remover { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, 0.6); color: #fff; display: grid; place-items: center; cursor: pointer; }
.mini .pag { position: absolute; left: 6px; bottom: 6px; background: rgba(0, 0, 0, 0.6); color: #fff; border-radius: 6px; font-size: 11px; padding: 2px 6px; font-weight: 600; }
.dicas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.dicas div { display: flex; gap: 10px; font-size: 13.5px; color: var(--text-2); align-items: flex-start; }
.dicas svg { color: var(--brand); margin-top: 1px; }
@media (max-width: 720px) { .dicas { grid-template-columns: 1fr; } }

/* carregando leitura */
.lendo { position: fixed; inset: 0; z-index: 100; background: rgba(10, 16, 14, 0.6); backdrop-filter: blur(3px); display: grid; place-items: center; padding: 20px; }
.lendo .caixa { background: var(--surface); border-radius: 18px; padding: 28px; max-width: 360px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); }
.lendo .etapa { color: var(--text-2); margin-top: 6px; min-height: 22px; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--brand-soft); border-top-color: var(--brand); animation: gira 0.9s linear infinite; margin: 0 auto 16px; }
.spinner.peq { width: 18px; height: 18px; border-width: 2px; margin: 0; }
@keyframes gira { to { transform: rotate(360deg); } }

/* nota */
.alerta { display: flex; gap: 12px; padding: 12px 14px; border-radius: 12px; font-size: 14px; align-items: flex-start; }
.alerta.aviso { background: var(--warn-soft); color: var(--warn); }
.alerta.ok { background: var(--brand-soft); color: var(--brand-ink); }
.alerta.info { background: var(--info-soft); color: var(--accent); }
.alerta ul { margin: 4px 0 0; padding-left: 18px; }

<script>window.__PDFJS_BASE = "vendor/pdfjs/"; window.__FIREBASE_CONFIG = {"apiKey":"AIzaSyAH6gGtu8lOLwVwj_twG1b8h_GJ7WeAXtY","authDomain":"prospec-notas.firebaseapp.com","projectId":"prospec-notas","appId":"1:179300852306:web:2395505e59fee79a29b58b"};</script>
<script>
// Notas do Giba — motor local para a versão de link aberto (GitHub Pages).
// Oferece a mesma interface que o app usa no claude.ai (window.claude.use("db" | "assets" | "sample")),
// mas guardando tudo no próprio navegador (IndexedDB): os dados continuam lá depois de fechar o
// navegador ou desligar o computador. A leitura de fotos usa o Google Gemini (plano grátis) com a chave do usuário.
(() => {
  const NOME_BANCO = 'notas-giba';
  const CHAVE_API = 'notas-giba:chave-gemini';
  let idb = null;
  let abrindo = null;
  const cache = new Map(); // caminho -> dados
  const urls = new Map(); // id do arquivo -> object URL
  const ouvintes = new Set();
  const canal = 'BroadcastChannel' in window ? new BroadcastChannel('notas-giba') : null;

  const req = (r) => new Promise((ok, erro) => ((r.onsuccess = () => ok(r.result)), (r.onerror = () => erro(r.error))));
  const fim = (t) => new Promise((ok, erro) => ((t.oncomplete = ok), (t.onerror = () => erro(t.error)), (t.onabort = () => erro(t.error || new Error('abortado')))));
  const clonar = (v) => (v === undefined ? undefined : structuredClone(v));
  const erroEspaco = (e) =>
    Object.assign(new Error(e?.name === 'QuotaExceededError' ? 'O navegador está sem espaço para guardar. Faça um backup e apague notas antigas.' : 'Não consegui salvar no navegador. Recarregue a página.'), { code: 'armazenamento' });

  function abrir() {
    abrindo ??= new Promise((ok, erro) => {
      if (!('indexedDB' in window)) return erro(new Error('Este navegador não consegue guardar dados. Use Chrome, Edge, Safari ou Firefox atualizados.'));
      const r = indexedDB.open(NOME_BANCO, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs');
        if (!d.objectStoreNames.contains('arquivos')) d.createObjectStore('arquivos');
      };
      r.onsuccess = async () => {
        idb = r.result;
        await recarregar();
        // pede para o navegador não apagar os dados sozinho quando faltar espaço
        try {
          await navigator.storage?.persist?.();
        } catch {}
        ok();
      };
      r.onerror = () => erro(r.error);
      r.onblocked = () => erro(new Error('Feche as outras abas do site e recarregue.'));
    });
    return abrindo;
  }

  async function recarregar() {
    const t = idb.transaction('docs');
    const docs = t.objectStore('docs');
    const [chaves, valores] = await Promise.all([req(docs.getAllKeys()), req(docs.getAll())]);
    cache.clear();
    chaves.forEach((k, i) => cache.set(k, valores[i]));
  }

  const avisar = () => setTimeout(() => ouvintes.forEach((f) => f()), 0);
  canal && (canal.onmessage = () => recarregar().then(avisar));

  async function gravar(caminho, valor) {
    await abrir();
    try {
      const t = idb.transaction('docs', 'readwrite');
      if (valor === undefined) t.objectStore('docs').delete(caminho);
      else t.objectStore('docs').put(valor, caminho);
      await fim(t);
    } catch (e) {
      throw erroEspaco(e);
    }
    if (valor === undefined) cache.delete(caminho);
    else cache.set(caminho, valor);
    avisar();
    canal?.postMessage('mudou');
  }

  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const segmentos = (p) => p.split('/').length;
  const snapDoc = (caminho) => ({
    id: caminho.split('/').pop(),
    exists: cache.has(caminho),
    data: () => clonar(cache.get(caminho)),
    metadata: { fromCache: true, hasPendingWrites: false },
  });

  function doc(caminho) {
    return {
      id: caminho.split('/').pop(),
      path: caminho,
      get: async () => (await abrir(), snapDoc(caminho)),
      set: (dados) => gravar(caminho, clonar(dados)),
      update: async (dados) => {
        await abrir();
        if (!cache.has(caminho)) throw Object.assign(new Error('Registro não existe mais.'), { code: 'not_found' });
        await gravar(caminho, { ...cache.get(caminho), ...clonar(dados) });
      },
      delete: () => gravar(caminho, undefined),
      onSnapshot(prox, erro) {
        const f = () => prox(snapDoc(caminho));
        ouvintes.add(f);
        abrir().then(f, (e) => erro?.(e));
        return () => ouvintes.delete(f);
      },
      collection: (sub) => colecao(`${caminho}/${sub}`),
    };
  }

  function colecao(caminho) {
    const listar = () => {
      const docs = [...cache.keys()].filter((k) => k.startsWith(caminho + '/') && segmentos(k) === segmentos(caminho) + 1).map(snapDoc);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: true, hasPendingWrites: false } };
    };
    return {
      path: caminho,
      doc: (id) => doc(`${caminho}/${id || novoId()}`),
      add: async (dados) => {
        const d = doc(`${caminho}/${novoId()}`);
        await d.set(dados);
        return d;
      },
      get: async () => (await abrir(), listar()),
      onSnapshot(prox, erro) {
        const f = () => prox(listar());
        ouvintes.add(f);
        abrir().then(f, (e) => erro?.(e));
        return () => ouvintes.delete(f);
      },
    };
  }

  const db = { doc, collection: colecao };

  const assets = {
    async upload(blob) {
      await abrir();
      const id = 'f' + novoId();
      try {
        const t = idb.transaction('arquivos', 'readwrite');
        t.objectStore('arquivos').put(blob, id);
        await fim(t);
      } catch (e) {
        throw erroEspaco(e);
      }
      const url = URL.createObjectURL(blob);
      urls.set(id, url);
      canal?.postMessage('mudou');
      return { id, url, sizeBytes: blob.size, contentType: blob.type };
    },
    async delete(id) {
      await abrir();
      const t = idb.transaction('arquivos', 'readwrite');
      t.objectStore('arquivos').delete(id);
      await fim(t);
      if (urls.has(id)) URL.revokeObjectURL(urls.get(id));
      urls.delete(id);
    },
  };

  // ---------------- leitura de fotos com o Google Gemini (plano gratuito) ----------------
  // Chave grátis em aistudio.google.com/apikey. Fica guardada só neste aparelho.
  // Se a cota grátis de um modelo acabar, tenta o próximo da lista.
  // [modelo, configuração de raciocínio, tempo máximo em ms]
  const MODELOS = {
    nota: [['gemini-3.5-flash-lite', null, 25000], ['gemini-3.6-flash', { thinkingLevel: 'minimal' }, 40000], ['gemini-3.8-flash', { thinkingLevel: 'low' }, 60000], ['gemini-2.5-flash', null, 60000]],
    nomes: [['gemini-3.8-flash', { thinkingLevel: 'low' }, 45000], ['gemini-3.6-flash', { thinkingLevel: 'minimal' }, 40000], ['gemini-3.5-flash-lite', null, 25000]],
  };
  const URL_API = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const T = (type, extra = {}) => ({ type, ...extra });
  const N = (type) => ({ type, nullable: true });
  const ITEM = T('OBJECT', {
    properties: {
      codigo: N('STRING'),
      descricao: T('STRING', { description: 'descrição exatamente como impressa na nota' }),
      nome_produto: T('STRING', { description: 'nome comercial claro e completo do produto, por extenso' }),

      properties: {
        eh_nota_fiscal: T('BOOLEAN'),
        moeda: T('STRING', { enum: ['USD', 'BRL'], description: 'USD é o padrão; BRL só quando há R$ ou é DANFE/NF-e brasileiro' }),
        emitente_nome: N('STRING'),
        emitente_cnpj: N('STRING'),
        numero: N('STRING'),
        serie: N('STRING'),

        data_emissao: N('STRING'),

    }),

          items: T('OBJECT', {
            properties: { indice: T('INTEGER'), nome_produto: T('STRING'), categoria: N('STRING'), encomendas_ids: T('ARRAY', { items: T('STRING') }) },
            required: ['indice', 'nome_produto', 'categoria', 'encomendas_ids'],

  const lerChave = () => {

    } catch {

  const paraBase64 = (blob) =>
    new Promise((ok, erro) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(',')[1]);
      r.onerror = () => erro(r.error);
      r.readAsDataURL(blob);
    });

  async function chamarGemini(chave, modelo, corpo, limite = 60000) {
    let r;
    const ctl = new AbortController();
    const relogio = setTimeout(() => ctl.abort(), limite);
    try {
      r = await fetch(`${URL_API}${modelo}:generateContent`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': chave },
        body: JSON.stringify(corpo),
        signal: ctl.signal,
      });
    } catch (e) {
      clearTimeout(relogio);
      if (ctl.signal.aborted) throw { code: 'proximo_modelo' }; // demorou demais: tenta o próximo
      throw { code: 'sem_internet' };
    }
    clearTimeout(relogio);
    let dados = null;
    try {
      dados = await r.json();
    } catch {}
    if (r.ok) return dados;
    const status = dados?.error?.status || '';
    const razao = JSON.stringify(dados?.error?.details || '');
    console.warn('[gemini]', modelo, r.status, dados?.error?.message);
    if (r.status === 400 && /API_KEY_INVALID/.test(razao + status)) throw { code: 'chave_invalida' };
    if (r.status === 401 || r.status === 403) throw { code: 'chave_invalida' };
    if (r.status === 429 || r.status === 404 || status === 'RESOURCE_EXHAUSTED' || status === 'NOT_FOUND') throw { code: 'proximo_modelo', limite: r.status === 429 };
    if (r.status === 400 && /thinking/i.test(dados?.error?.message || '')) throw { code: 'proximo_modelo' };
    if (r.status === 400) throw { code: 'pedido_recusado' };
    throw { code: 'proximo_modelo' };
  }

  function criarSample(chave) {
    return {
      provedor: 'gemini',
      limits: async () => ({ images: { maxCount: 8, maxInputBytes: 15 * 1024 * 1024, mediaTypes: ['image/jpeg', 'image/png', 'image/webp'] }, modelTiers: ['default'] }),
      async json(prompt, opcoes = {}) {
        const imagens = opcoes.images ? [].concat(opcoes.images) : [];
        const partes = [];
        for (const b of imagens) partes.push({ inline_data: { mime_type: b.type || 'image/jpeg', data: await paraBase64(b) } });
        partes.push({ text: prompt });
        const tipo = opcoes.tipo === 'nomes' ? 'nomes' : 'nota';
        let limite = false;
        for (const [modelo, pensar, tempo] of MODELOS[tipo]) {
          const corpo = {
            contents: [{ role: 'user', parts: partes }],
            generationConfig: { responseMimeType: 'application/json', responseSchema: ESQUEMAS[tipo], temperature: 0.1, maxOutputTokens: 16384, ...(pensar ? { thinkingConfig: pensar } : {}) },
          };
          let dados;
          try {
            dados = await chamarGemini(chave, modelo, corpo, tempo);
          } catch (e) {
            if (e.code === 'proximo_modelo') {
              limite ||= e.limite;
              continue;
            }
            throw e;
          }
          if (dados?.promptFeedback?.blockReason) throw { code: 'refused' };
          const cand = dados?.candidates?.[0];
          const texto = (cand?.content?.parts || []).filter((p) => !p.thought && typeof p.text === 'string').map((p) => p.text).join('');
          if (!texto) {
            if (cand?.finishReason === 'SAFETY' || cand?.finishReason === 'PROHIBITED_CONTENT') throw { code: 'refused' };
            continue;
          }
          try {
            return JSON.parse(texto.replace(/^```(?:json)?\s*|\s*```$/g, ''));
          } catch {
            if (cand?.finishReason === 'MAX_TOKENS') throw { code: 'prompt_too_large' };
            throw { code: 'invalid_json' };
          }
        }
        throw { code: limite ? 'limite_gratis' : 'upstream_error' };
      },
    };
  }

  // ---------------- backup ----------------
  async function exportar() {
    await abrir();
    const t = idb.transaction('arquivos');
    const s = t.objectStore('arquivos');
    const [ids, blobs] = await Promise.all([req(s.getAllKeys()), req(s.getAll())]);
    const arquivos = {};
    for (let i = 0; i < ids.length; i++) arquivos[ids[i]] = { tipo: blobs[i].type, base64: await paraBase64(blobs[i]) };
    const conteudo = { app: 'notas-giba', versao: 1, exportado_em: new Date().toISOString(), docs: Object.fromEntries(cache), arquivos };
    return new Blob([JSON.stringify(conteudo)], { type: 'application/json' });
  }

  async function importar(arquivo) {
    await abrir();
    let dados;
    try {
      dados = JSON.parse(await arquivo.text());
    } catch {
      throw new Error('Este arquivo não é um backup válido.');
    }
    if (dados?.app !== 'notas-giba' || typeof dados.docs !== 'object') throw new Error('Este arquivo não é um backup do Notas do Giba.');
    const t = idb.transaction(['docs', 'arquivos'], 'readwrite');
    const docs = t.objectStore('docs');
    const arqs = t.objectStore('arquivos');
    docs.clear();
    arqs.clear();
    for (const [k, v] of Object.entries(dados.docs)) docs.put(v, k);
    for (const [id, a] of Object.entries(dados.arquivos || {})) {
      const bin = Uint8Array.from(atob(a.base64), (c) => c.charCodeAt(0));
      arqs.put(new Blob([bin], { type: a.tipo || 'image/jpeg' }), id);
    }
    try {
      await fim(t);
    } catch (e) {
      throw erroEspaco(e);
    }
    await recarregar();
    avisar();
    canal?.postMessage('mudou');
    return Object.keys(dados.docs).length;
  }

  async function espaco() {
    try {
      const [est, persistido] = await Promise.all([navigator.storage?.estimate?.(), navigator.storage?.persisted?.()]);
      return { usado: est?.usage || 0, total: est?.quota || 0, persistido: Boolean(persistido) };
    } catch {
      return null;
    }
  }

  // foto da nota: lida do aparelho só quando aparece na tela
  const carregando = new Set();
  function urlFoto(id) {
    if (urls.has(id)) return urls.get(id);
    if (idb && !carregando.has(id)) {
      carregando.add(id);
      req(idb.transaction('arquivos').objectStore('arquivos').get(id)).then((blob) => {
        if (blob) { urls.set(id, URL.createObjectURL(blob)); avisar(); }
      }).catch(() => {}).finally(() => carregando.delete(id));
    }
    return '';
  }

  // ---------------- sincronização entre aparelhos (Firebase / Firestore) ----------------
  // Sem configuração ou sem "espaço" escolhido, tudo continua só no aparelho (modo local acima).
  const FIREBASE = window.__FIREBASE_CONFIG || null;
  const CHAVE_ESPACO = 'notas-giba:espaco';
  const lerLS = (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
  const gravarLS = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} };
  let ESPACO = lerLS(CHAVE_ESPACO);
  let fs = null;
  let carregandoKit = null;
  let aoMudarFoto = () => {};
  const novoEspaco = () => { const a = new Uint8Array(24); crypto.getRandomValues(a); return Array.from(a, (b) => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 56]).join(''); };

  function carregarKit() {
    carregandoKit ??= new Promise((ok, erro) => {
      if (window.FB) return ok();
      const s = document.createElement('script');
      s.src = 'vendor/sync.js';
      s.onload = () => ok();
      s.onerror = () => { carregandoKit = null; erro(new Error('Não consegui carregar a sincronização. Verifique a internet e recarregue.')); };
      document.head.append(s);
    });
    return carregandoKit;
  }

  let conectando = null;
  function conectarFirestore() {
    // uma única conexão, mesmo quando dados e fotos pedem ao mesmo tempo
    conectando ??= (async () => {
      await carregarKit();
      let f;
      try {
        f = FB.initializeFirestore(FB.initializeApp(FIREBASE), { ignoreUndefinedProperties: true, localCache: FB.persistentLocalCache({ tabManager: FB.persistentMultipleTabManager() }) });
      } catch {
        // navegador sem armazenamento persistente (ex.: modo anônimo): funciona só com internet
        f = FB.initializeFirestore(FB.initializeApp(FIREBASE, 'sem-cache'), { ignoreUndefinedProperties: true });
      }
      const emu = lerLS('notas-giba:emulador'); // só para testes
      if (emu) FB.connectFirestoreEmulator(f, emu.split(':')[0], Number(emu.split(':')[1]));
      fs = f;
      return f;
    })().catch((e) => { conectando = null; throw e; });
    return conectando;
  }

  // Gravação que não trava a tela: o Firestore aplica na hora no aparelho e envia quando houver internet.
  function semEsperar(prom) {
    prom.catch((e) => { console.warn('[sync]', e); window.dispatchEvent(new CustomEvent('notas-erro-sync', { detail: e?.code || e?.message })); });
    return Promise.race([prom, new Promise((ok) => setTimeout(ok, 1500))]).then(() => {});
  }

  function criarRemoto(fs, espaco) {
    const base = `espacos/${espaco}/`;
    const conv = (s) => ({ id: s.id, exists: s.exists(), data: () => s.data(), metadata: s.metadata });
    const convLista = (s) => ({ docs: s.docs.map(conv), size: s.size, empty: s.empty, metadata: s.metadata, docChanges: () => [] });
    function rdoc(p) {
      const r = FB.doc(fs, base + p);
      return {
        id: r.id,
        path: p,
        get: async () => conv(await FB.getDoc(r)),
        set: (d) => semEsperar(FB.setDoc(r, clonar(d))),
        update: (d) => semEsperar(FB.updateDoc(r, clonar(d))),
        delete: () => semEsperar(FB.deleteDoc(r)),
        onSnapshot: (prox, erro) => FB.onSnapshot(r, (s) => prox(conv(s)), erro),
        collection: (sub) => rcol(`${p}/${sub}`),
      };
    }
    function rcol(p) {
      const c = FB.collection(fs, base + p);
      return {
        path: p,
        doc: (id) => rdoc(`${p}/${id || FB.doc(c).id}`),
        add: async (d) => { const r = FB.doc(c); await semEsperar(FB.setDoc(r, clonar(d))); return rdoc(`${p}/${r.id}`); },
        get: async () => convLista(await FB.getDocs(c)),
        onSnapshot: (prox, erro) => FB.onSnapshot(c, (s) => prox(convLista(s)), erro),
      };
    }
    return { doc: rdoc, collection: rcol };
  }

  // fotos: guardadas como documentos (imagem comprimida), para não precisar de plano pago
  async function reduzir(blob, lado = 1400, q = 0.72) {
    const bmp = await createImageBitmap(blob);
    const k = Math.min(1, lado / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return new Promise((ok) => cv.toBlob(ok, 'image/jpeg', q));
  }
  const deBase64 = (b64, tipo) => new Blob([Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))], { type: tipo || 'image/jpeg' });

  function criarArquivosRemotos(fs, espaco) {
    const col = FB.collection(fs, `espacos/${espaco}/arquivos`);
    return {
      async upload(blob) {
        let b = blob;
        if (b.size > 600000) b = await reduzir(b);
        if (b.size > 600000) b = await reduzir(b, 1100, 0.6);
        const r = FB.doc(col);
        await semEsperar(FB.setDoc(r, { tipo: b.type || 'image/jpeg', dados: await paraBase64(b), criado_em: new Date().toISOString() }));
        const url = URL.createObjectURL(b);
        urls.set(r.id, url);
        return { id: r.id, url, sizeBytes: b.size, contentType: b.type };
      },
      async delete(id) {
        await semEsperar(FB.deleteDoc(FB.doc(col, id)));
        if (urls.has(id)) URL.revokeObjectURL(urls.get(id));
        urls.delete(id);
      },
    };
  }
  const buscandoFoto = new Set();
  function urlFotoRemota(id) {
    if (urls.has(id)) return urls.get(id);
    if (fs && !buscandoFoto.has(id)) {
      buscandoFoto.add(id);
      FB.getDoc(FB.doc(fs, `espacos/${ESPACO}/arquivos/${id}`)).then((s) => {
        const d = s.data();
        if (d?.dados) { urls.set(id, URL.createObjectURL(deBase64(d.dados, d.tipo))); aoMudarFoto(); }
      }).catch(() => {}).finally(() => buscandoFoto.delete(id));
    }
    return '';
  }

  // Leva tudo o que está só neste aparelho para o espaço compartilhado (sem apagar nada de lá).
  async function enviarDadosLocais(espaco, aoProgresso = () => {}) {
    await abrir();
    const f = await conectarFirestore();
    const base = `espacos/${espaco}/`;
    const t = idb.transaction('arquivos');
    const [ids, blobs] = await Promise.all([req(t.objectStore('arquivos').getAllKeys()), req(t.objectStore('arquivos').getAll())]);
    const itens = [...cache.entries()];
    const ajustesRemotos = await FB.getDoc(FB.doc(f, base + 'config/ajustes')).then((s) => s.exists()).catch(() => false);
    let lote = FB.writeBatch(f), n = 0, feitos = 0;
    const total = itens.length + ids.length;
    const fechar = async () => { if (n) { await lote.commit(); lote = FB.writeBatch(f); n = 0; } };
    for (const [caminho, valor] of itens) {
      if (caminho === 'config/ajustes' && ajustesRemotos) continue;
      lote.set(FB.doc(f, base + caminho), clonar(valor)); n++; feitos++;
      if (n >= 300) { await fechar(); aoProgresso(feitos, total); }
    }
    await fechar();
    for (let i = 0; i < ids.length; i++) {
      let b = blobs[i];
      if (b.size > 600000) b = await reduzir(b);
      await FB.setDoc(FB.doc(f, `${base}arquivos/${ids[i]}`), { tipo: b.type || 'image/jpeg', dados: await paraBase64(b), criado_em: new Date().toISOString() });
      feitos++; aoProgresso(feitos, total);
    }
    gravarLS(`notas-giba:enviado-${espaco}`, '1');
    return total;
  }

  async function exportarRemoto() {
    const f = await conectarFirestore();
    const base = `espacos/${ESPACO}/`;
    const docs = {};
    for (const c of ['notas', 'contatos', 'encomendas', 'config']) {
      const s = await FB.getDocs(FB.collection(f, base + c));
      s.docs.forEach((d) => (docs[`${c}/${d.id}`] = d.data()));
    }
    const arquivos = {};
    const s = await FB.getDocs(FB.collection(f, base + 'arquivos'));
    s.docs.forEach((d) => (arquivos[d.id] = { tipo: d.data().tipo, base64: d.data().dados }));
    return new Blob([JSON.stringify({ app: 'notas-giba', versao: 1, exportado_em: new Date().toISOString(), docs, arquivos })], { type: 'application/json' });
  }

  async function importarRemoto(arquivo) {
    let dados;
    try { dados = JSON.parse(await arquivo.text()); } catch { throw new Error('Este arquivo não é um backup válido.'); }
    if (dados?.app !== 'notas-giba' || typeof dados.docs !== 'object') throw new Error('Este arquivo não é um backup do Notas do Giba.');
    const f = await conectarFirestore();
    const base = `espacos/${ESPACO}/`;
    let lote = FB.writeBatch(f), n = 0;
    for (const [k, v] of Object.entries(dados.docs)) { lote.set(FB.doc(f, base + k), v); if (++n >= 300) { await lote.commit(); lote = FB.writeBatch(f); n = 0; } }
    if (n) await lote.commit();
    for (const [id, a] of Object.entries(dados.arquivos || {})) await FB.setDoc(FB.doc(f, `${base}arquivos/${id}`), { tipo: a.tipo || 'image/jpeg', dados: a.base64 });
    return Object.keys(dados.docs).length;
  }

  const linkConexao = (comChave) => {
    const dados = { e: ESPACO };
    if (comChave && lerChave()) dados.k = lerChave();
    const b64 = btoa(JSON.stringify(dados)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return `${location.origin}${location.pathname}#conectar-${b64}`;
  };
  function lerLinkConexao() {
    if (!/^#conectar-/.test(location.hash)) return null;
    try {
      const b64 = location.hash.slice(10).replace(/-/g, '+').replace(/_/g, '/');
      const d = JSON.parse(atob(b64 + '='.repeat((4 - (b64.length % 4)) % 4)));
      history.replaceState(null, '', location.pathname + location.search + '#inicio');
      return d && typeof d.e === 'string' && d.e.length >= 20 ? d : null;
    } catch { history.replaceState(null, '', location.pathname + location.search + '#inicio'); return null; }
  }
  const qrSvg = (texto) => { if (!window.QR) return ''; const q = QR(0, 'M'); q.addData(texto); q.make(); return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); };

  const sincronizacao = {
    disponivel: Boolean(FIREBASE),
    get ativa() { return Boolean(FIREBASE && ESPACO); },
    get espaco() { return ESPACO; },
    linkConexao,
    qrSvg,
    carregarKit,
    // liga a sincronização neste aparelho criando um espaço novo (ou entrando num existente)
    async ligar(espaco = novoEspaco(), aoProgresso) {
      if (!FIREBASE) throw new Error('A sincronização ainda não foi configurada no site.');
      const n = await enviarDadosLocais(espaco, aoProgresso);
      gravarLS(CHAVE_ESPACO, espaco); ESPACO = espaco;
      return n;
    },
    desligar() { gravarLS(CHAVE_ESPACO, ''); ESPACO = ''; },
  };

  window.__NOTAS_LOCAL = {
    url: (id) => (sincronizacao.ativa ? urlFotoRemota(id) : urlFoto(id)),
    set aoMudarFoto(fn) { aoMudarFoto = fn; },
    chave: lerChave,
    salvarChave(chave) {
      try {
        if (chave) localStorage.setItem(CHAVE_API, chave);
        else localStorage.removeItem(CHAVE_API);
      } catch {
        throw new Error('O navegador não deixou guardar a chave (modo anônimo?).');
      }
    },
    exportar: () => (sincronizacao.ativa ? exportarRemoto() : exportar()),
    importar: (a) => (sincronizacao.ativa ? importarRemoto(a) : importar(a)),
    espaco,
    sincronizacao,
    lerLinkConexao,
  };

  window.claude = {
    async use(nome) {
      if (nome === 'db' || nome === 'assets') {
        if (sincronizacao.ativa) {
          try {
            const f = await conectarFirestore();
            return nome === 'db' ? criarRemoto(f, ESPACO) : criarArquivosRemotos(f, ESPACO);
          } catch (e) {
            console.warn('[sync] sem sincronização agora, usando o aparelho', e);
          }
        }
        return abrir().then(() => (nome === 'db' ? db : assets));
      }
      if (nome === 'sample') {
        const chave = lerChave();
        return chave ? criarSample(chave) : null;
      }
      return null;
    },
  };
})();

</script>
<script>
(() => {
// Cálculos compartilhados entre o navegador e o servidor (mesma regra nos dois lados).

const MODOS_ARREDONDAMENTO = {
  nenhum: 'Sem arredondar (centavos exatos)',
  '90': 'Terminar em ,90 (ex.: R$ 129,90)',
  inteiro: 'Real inteiro para cima (ex.: R$ 130,00)',
  '5': 'Múltiplo de R$ 5 para cima',
  '10': 'Múltiplo de R$ 10 para cima',
};

const centavos = (v) => Math.round((Number(v) || 0) * 100) / 100;

function arredondar(valor, modo = 'nenhum') {
  const v = centavos(valor);
  if (v <= 0) return v;
  switch (String(modo)) {
    case '90': {
      const base = Math.floor(v) + 0.9;
      return centavos(base >= v ? base : base + 1);
    }
    case 'inteiro':
      return Math.ceil(v - 0.0001);
    case '5':
      return Math.ceil(v / 5 - 0.00001) * 5;
    case '10':
      return Math.ceil(v / 10 - 0.00001) * 10;
    default:
      return v;
  }
}

// Fator que espalha frete, impostos (IPI/ST), seguro e descontos da nota proporcionalmente
// ao valor de cada item, para o custo refletir o que realmente foi pago.
// Nota em dólar: os valores ficam na moeda original e o custo é convertido para reais pela cotação.
function cambio(nota) {
  if (nota.moeda !== 'USD') return 1;
  const c = Number(nota.cotacao);
  return c > 0 ? c : 1;
}

function fatorRateio(nota, itens) {
  const soma = itens.reduce((s, i) => s + (Number(i.valor_total) || 0), 0);
  const total = Number(nota.valor_total) || 0;
  const rateio = !nota.ratear_despesas || soma <= 0 || total <= 0 ? 1 : total / soma;
  return rateio * cambio(nota);
}

function markupDoItem(item, nota) {
  const m = item.markup;
  return m === null || m === undefined || m === '' ? Number(nota.markup_padrao) || 0 : Number(m);
}

function calcularItem(item, nota, fator = 1, modo = 'nenhum') {
  const qtd = Number(item.quantidade) > 0 ? Number(item.quantidade) : 1;
  const custoTotal = (Number(item.valor_total) || 0) * fator;
  const custoUnit = custoTotal / qtd;
  const markup = markupDoItem(item, nota);
  const precoUnit = arredondar(custoUnit * (1 + markup / 100), modo);
  const precoTotal = centavos(precoUnit * qtd);
  const lucro = precoTotal - custoTotal;
  return {
    quantidade: qtd,
    custoUnit,
    custoTotal,
    markup,
    markupProprio: !(item.markup === null || item.markup === undefined || item.markup === ''),
    precoUnit,
    precoTotal,
    lucro,
    margem: precoTotal > 0 ? (lucro / precoTotal) * 100 : 0,
  };
}

function markupParaPreco(custoUnit, precoUnit) {
  if (!(custoUnit > 0)) return 0;
  return Math.round((precoUnit / custoUnit - 1) * 100 * 1e6) / 1e6;
}

function resumoNota(nota, itens, modo = 'nenhum') {
  const fator = fatorRateio(nota, itens);
  let investido = 0;
  let venda = 0;
  const calculados = itens.map((i) => {
    const c = calcularItem(i, nota, fator, modo);
    investido += c.custoTotal;
    venda += c.precoTotal;
    return { ...i, calc: c };
  });
  const lucro = venda - investido;
  return {
    fator,
    itens: calculados,
    investido,
    venda,
    lucro,
    margem: venda > 0 ? (lucro / venda) * 100 : 0,
  };
}

// ---------- formatação ----------
const fmtBRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const reais = (v) => fmtBRL.format(Number(v) || 0);
const fmtUSD = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'USD' });
const dolares = (v) => fmtUSD.format(Number(v) || 0);
// valor na moeda original da nota
const naMoeda = (v, moeda) => (moeda === 'USD' ? dolares(v) : reais(v));

function numeroBR(v, casas = 2) {
  return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: casas });
}

// Aceita "1.234,56", "1234,56", "1234.56", "R$ 10".
function lerNumero(texto) {
  if (typeof texto === 'number') return texto;
  let s = String(texto ?? '').replace(/[^\d,.-]/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');

function montarMensagem(modelo, { nome, itens, loja }) {
  const comPreco = itens.filter((i) => i.valorUnit !== null && i.valorUnit !== undefined);

    const q = Number(i.quantidade) || 1;
    const qtd = q !== 1 ? `${numeroBR(q, 3)}x ` : '';
    const preco = i.valorUnit === null || i.valorUnit === undefined ? '' : ` — *${reais(i.valorUnit * q)}*`;

  const total = comPreco.reduce((s, i) => s + i.valorUnit * (Number(i.quantidade) || 1), 0);
  let texto = String(modelo || MENSAGEM_PADRAO);
  if (!comPreco.length) texto = texto.replace(/^[^\n]*\{total\}[^\n]*\n?/m, '');

    .replaceAll('{nome_completo}', String(nome || '').trim())

// Combina itens da nota fiscal com encomendas pendentes, por semelhança de texto.
// Ex.: encomenda "iPhone 14 128gb" x item "APPLE IPHONE 14 128GB AZUL MPVN3BZ/A".
// Números (modelo, capacidade) precisam bater; palavras comuns são ignoradas.

const IGNORAR = new Set([
  'de', 'da', 'do', 'das', 'dos', 'e', 'com', 'para', 'p', 'c', 'a', 'o', 'em', 'un', 'und', 'unid',
  'pc', 'pcs', 'peca', 'cx', 'kit', 'novo', 'nova', 'original', 'cor', 'modelo', 'mod', 'ref',
]);

function normalizar(texto) {
  return String(texto || '')
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/(\d+)[\s-]*(gb|tb|mb|ml|l|mm|cm|m|kg|g|w|v|pol|polegadas|")\b/g, '$1$2')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function palavras(texto) {
  return normalizar(texto)
    .split(' ')
    .filter((p) => p && !IGNORAR.has(p));
}

const temDigito = (p) => /\d/.test(p);

// Nota de 0 a 1: quanto da descrição da encomenda aparece no item.
function semelhanca(encomenda, item) {
  const pe = [...new Set(palavras(encomenda))];
  if (!pe.length) return 0;
  const pi = palavras(item);
  const conjunto = new Set(pi);
  const bate = (p) =>
    conjunto.has(p) ||
    (!temDigito(p) && p.length >= 4 && pi.some((x) => x.length >= 4 && (x.startsWith(p) || p.startsWith(x))));
  const numeros = pe.filter(temDigito);
  if (numeros.some((n) => !bate(n))) return 0;
  const texto = pe.filter((p) => !temDigito(p));
  if (texto.length && !texto.some(bate)) return 0;
  const acertos = pe.filter(bate).length;
  return acertos / pe.length;
}

const LIMITE = 0.7;

// Distribui encomendas pendentes entre os itens, respeitando a quantidade de cada item.
// sugestoesIA: Map(itemIndex -> [encomendaId]) vindo da leitura da nota (opcional, tem prioridade).
function distribuir(itens, encomendas, sugestoesIA = new Map()) {
  const livre = itens.map((i) => Number(i.quantidade) || 1);
  const usadas = new Set();
  const vinculos = []; // { itemIndex, encomendaId }
  const porId = new Map(encomendas.map((e) => [e.id, e]));

  const tentar = (idx, enc) => {
    if (usadas.has(enc.id)) return;
    const q = Number(enc.quantidade) || 1;
    if (livre[idx] + 1e-9 < q) return;
    livre[idx] -= q;
    usadas.add(enc.id);
    vinculos.push({ itemIndex: idx, encomendaId: enc.id });
  };

  for (const [idx, ids] of sugestoesIA) {
    for (const id of ids) if (porId.has(id) && itens[idx]) tentar(idx, porId.get(id));
  }

  const candidatos = [];
  encomendas.forEach((enc) => {
    itens.forEach((item, idx) => {
      const s = semelhanca(enc.produto, `${item.nome || ''} ${item.descricao} ${item.codigo || ''}`);
      if (s >= LIMITE) candidatos.push({ enc, idx, s });
    });
  });
  // melhor semelhança primeiro; em empate, quem encomendou antes
  candidatos.sort((a, b) => b.s - a.s || String(a.enc.criado_em).localeCompare(String(b.enc.criado_em)) || a.enc.id - b.enc.id);
  for (const c of candidatos) tentar(c.idx, c.enc);
  return vinculos;
}

function decodificar(s) {

function ehXmlNFe(texto) {
  return /<(?:\w+:)?infNFe[\s>]/.test(texto) && /<(?:\w+:)?det[\s>]/.test(texto);

function lerXmlNFe(xml) {
  if (!ehXmlNFe(xml)) throw new Error('Este arquivo não parece ser o XML de uma NF-e.');
  const chaveM = xml.match(/<(?:\w+:)?infNFe[^>]*\sId="NFe(\d{44})"/);

  const emit = bloco(xml, 'emit');

      ordem: i,
      codigo: tag(prod, 'cProd'),
      descricao: tag(prod, 'xProd') || `Item ${i + 1}`,
      ncm: tag(prod, 'NCM'),
      quantidade: qtd || 1,
      unidade: tag(prod, 'uCom'),
      valor_unitario: num(tag(prod, 'vUnCom')),
      valor_total: num(tag(prod, 'vProd')),
      _ipi: num(tag(bloco(imposto, 'IPI'), 'vIPI')),

    numero: tag(ide, 'nNF'),
    serie: tag(ide, 'serie'),
    chave: chaveM ? chaveM[1] : null,
    emitente_nome: tag(emit, 'xFant') || tag(emit, 'xNome'),
    emitente_cnpj: tag(emit, 'CNPJ') || tag(emit, 'CPF'),

    seguro: num(tag(tot, 'vSeg')),

    impostos,
    valor_total: num(tag(tot, 'vNF')),
    itens: itens.map(({ _ipi, ...i }) => i),
    avisos: [],
  };
}

    origem = 'nota';
  }
  if (e.valor_combinado !== null && e.valor_combinado !== undefined && e.valor_combinado !== '') {
    valorUnit = Number(e.valor_combinado) / qtd;
    origem = 'combinado';
  }
  return {
    ...e,
    quantidade: qtd,
    contato_nome: c?.nome || 'Cliente removido',
    contato_telefone: c?.telefone || '',
    nota_id: item ? e.nota_id : null,
    item_id: item ? e.item_id : null,
    item_descricao: item ? nomeItem(item) : undefined,
    nota_numero: n?.numero,
    nota_emitente: n?.emitente_nome,
    valor_unit: valorUnit,
    valor_total: valorUnit === null ? null : valorUnit * qtd,
    valor_origem: origem,
    custo_total: custoUnit === null ? null : custoUnit * qtd,
  };
}

const ORDEM_STATUS = { chegou: 0, avisado: 1, aguardando: 2, entregue: 3, cancelada: 4 };
function listarEncomendas({ status, busca, contato_id } = {}) {
  let l = [...S.encomendas.values()].map(enc);
  if (status === 'abertas') l = l.filter((e) => ['aguardando', 'chegou', 'avisado'].includes(e.status));
  else if (status && status !== 'todas') l = l.filter((e) => e.status === status);
  if (contato_id) l = l.filter((e) => e.contato_id === contato_id);
  if (busca) {
    const b = normalizar(busca);
    l = l.filter((e) => normalizar(`${e.produto} ${e.contato_nome} ${e.item_descricao || ''}`).includes(b));
  }
  return l.sort((a, b) => (ORDEM_STATUS[a.status] ?? 9) - (ORDEM_STATUS[b.status] ?? 9) || String(b.criado_em).localeCompare(String(a.criado_em)));
}

const nomeItem = (i) => i?.nome || i?.descricao || '';
const pendentes = () =>
  [...S.encomendas.values()]
    .filter((e) => e.status === 'aguardando' && !e.item_id)
    .sort((a, b) => String(a.criado_em).localeCompare(String(b.criado_em)));

const dataNota = (n) => n.data_emissao || diaLocal(n.criado_em);

function resumoLista(n) {
  const r = resumo(n);
  const vinc = [...S.encomendas.values()].filter((e) => e.nota_id === n.id && (n.itens || []).some((i) => i.id === e.item_id));

    primeiro_item: nomeItem(n.itens?.[0]),

  };
}

function listarNotas(busca) {
  let l = [...S.notas.values()];
  if (busca) {
    const b = normalizar(busca);
    l = l.filter((n) => normalizar(`${n.emitente_nome || ''} ${n.numero || ''} ${(n.itens || []).map((i) => `${i.descricao} ${i.nome || ''}`).join(' ')}`).includes(b));
  }
  return l.sort((a, b) => dataNota(b).localeCompare(dataNota(a)) || String(b.criado_em).localeCompare(String(a.criado_em))).map(resumoLista);
}

function limparItem(i, ordem) {
  const descricao = String(i.descricao ?? '').trim().slice(0, 300);
  if (!descricao) throw new ErroUsuario('Todo item precisa de uma descrição.');
  const q = Number(i.quantidade);
  const quantidade = q > 0 ? q : 1;
  let vu = Number(i.valor_unitario) || 0;
  let vt = Number(i.valor_total) || 0;
  if (!vt && vu) vt = Math.round(vu * quantidade * 100) / 100;
  if (!vu && vt) vu = vt / quantidade;
  const txt = (v, m) => (String(v ?? '').trim() ? String(v).trim().slice(0, m) : null);
  return {
    id: i.id || novoId(),
    ordem: i.ordem ?? ordem,
    codigo: txt(i.codigo, 60),
    descricao,
    nome: txt(i.nome, 200),
    categoria: txt(i.categoria, 40),
    ncm: txt(i.ncm, 20),
    quantidade,
    unidade: txt(i.unidade, 10),
    valor_unitario: vu,
    valor_total: vt,
    markup: i.markup === '' || i.markup === undefined ? null : i.markup,
  };
}

// Liga encomendas pendentes aos itens da nota (semelhança do texto + sugestão da IA).
async function combinarNota(nota, sugestoes = new Map()) {
  const itens = nota.itens || [];
  const comprometido = (item) =>
    [...S.encomendas.values()].filter((e) => e.nota_id === nota.id && e.item_id === item.id).reduce((s, e) => s + (Number(e.quantidade) || 1), 0);
  const disponiveis = itens.map((i) => ({ ...i, quantidade: Math.max(0, i.quantidade - comprometido(i)) }));
  const vinculos = distribuir(disponiveis, pendentes(), sugestoes);
  for (const v of vinculos) {
    await S.db.doc(`encomendas/${v.encomendaId}`).update({ nota_id: nota.id, item_id: itens[v.itemIndex].id, status: 'chegou', chegou_em: agoraISO() });
  }
  return vinculos.length;
}

async function criarNota(dados, { origem = 'manual', arquivos = [], sugestoes = new Map() } = {}) {
  const itens = (dados.itens || []).map((i, k) => limparItem(i, k));
  if (!itens.length) throw new ErroUsuario('A nota precisa de pelo menos um item.');
  const soma = itens.reduce((s, i) => s + i.valor_total, 0);
  const chave = dados.chave ? String(dados.chave).replace(/\D/g, '') : null;
  if (chave && chave.length === 44) {
    const existe = [...S.notas.values()].find((n) => n.chave === chave);
    if (existe) throw Object.assign(new ErroUsuario('Esta nota já estava cadastrada.'), { notaId: existe.id });
  }
  const num = (v) => Number(v) || 0;
  const nota = {
    numero: dados.numero || null,
    serie: dados.serie || null,
    chave,
    emitente_nome: dados.emitente_nome || null,
    emitente_cnpj: dados.emitente_cnpj ? String(dados.emitente_cnpj).replace(/\D/g, '') : null,
    data_emissao: /^\d{4}-\d{2}-\d{2}$/.test(dados.data_emissao || '') ? dados.data_emissao : null,
    valor_produtos: num(dados.valor_produtos) || soma,
    frete: num(dados.frete),
    seguro: num(dados.seguro),
    desconto: num(dados.desconto),
    outras: num(dados.outras),
    impostos: num(dados.impostos),
    valor_total: num(dados.valor_total) || soma,
    moeda: dados.moeda === 'USD' ? 'USD' : 'BRL',
    cotacao: null,
    markup_padrao: Number.isFinite(Number(dados.markup_padrao)) && dados.markup_padrao !== null && dados.markup_padrao !== '' ? Number(dados.markup_padrao) : Number(S.ajustes.markup_padrao),
    ratear_despesas: dados.ratear_despesas === false ? 0 : 1,
    origem,
    arquivos,
    avisos: dados.avisos || [],
    observacoes: dados.observacoes || null,
    itens,
    criado_em: agoraISO(),
  };
  if (nota.moeda === 'USD') {
    if (Number(dados.cotacao) > 0) nota.cotacao = Number(dados.cotacao);
    else {
      const c = await obterCotacao();
      if (c) { nota.cotacao = c.valor; nota.cotacao_fonte = c.fonte; }
    }
  }
  const ref = await S.db.collection('notas').add(nota);
  const vinculadas = await combinarNota({ ...nota, id: ref.id }, sugestoes);
  return { id: ref.id, vinculadas };
}

async function mudarStatus(ids, status) {
  const campo = { chegou: 'chegou_em', avisado: 'avisado_em', entregue: 'entregue_em' }[status];
  for (const id of ids) {
    const e = S.encomendas.get(id);
    if (!e) continue;
    const d = { status };
    if (campo && !e[campo]) d[campo] = agoraISO();
    if (status === 'aguardando' || status === 'chegou') Object.assign(d, { avisado_em: null, entregue_em: null });

    if (status === 'avisado') d.entregue_em = null;

function painel(periodo) {
  const hoje = diaLocal(agoraISO());
  const [y, m] = hoje.split('-').map(Number);
  const iso = (d) => d.toISOString().slice(0, 10);
  const faixas = {
    mes: [iso(new Date(Date.UTC(y, m - 1, 1))), iso(new Date(Date.UTC(y, m, 0)))],
    mes_passado: [iso(new Date(Date.UTC(y, m - 2, 1))), iso(new Date(Date.UTC(y, m - 1, 0)))],
    '30d': [iso(new Date(Date.parse(hoje) - 29 * 864e5)), hoje],
    ano: [`${y}-01-01`, `${y}-12-31`],
    tudo: ['0000-01-01', '9999-12-31'],
  };
  const [de, ate] = faixas[periodo] || faixas.mes;
  const notas = [...S.notas.values()].filter((n) => dataNota(n) >= de && dataNota(n) <= ate);
  let investido = 0;
  let venda = 0;
  for (const n of notas) {
    const r = resumo(n);
    investido += r.investido;
    venda += r.venda;
  }
  const todas = [...S.encomendas.values()].map(enc);
  const entregues = todas.filter((e) => e.status === 'entregue' && e.entregue_em && diaLocal(e.entregue_em) >= de && diaLocal(e.entregue_em) <= ate);
  const vendido = entregues.reduce((s, e) => s + (e.valor_total || 0), 0);
  const custo = entregues.reduce((s, e) => s + (e.custo_total || 0), 0);
  const conta = (st) => todas.filter((e) => e.status === st).length;
  const meses = [];
  for (let k = 5; k >= 0; k--) {
    const ini = iso(new Date(Date.UTC(y, m - 1 - k, 1)));
    const fim = iso(new Date(Date.UTC(y, m - k, 0)));
    let inv = 0;
    let ven = 0;
    for (const n of S.notas.values()) {
      if (dataNota(n) < ini || dataNota(n) > fim) continue;
      const r = resumo(n);
      inv += r.investido;
      ven += r.venda;
    }
    meses.push({ mes: ini.slice(0, 7), investido: inv, venda: ven, lucro: ven - inv });
  }
  return {
    notas: notas.length,
    investido,
    venda_prevista: venda,
    lucro_previsto: venda - investido,
    vendido,
    lucro_realizado: vendido - custo,
    encomendas: { aguardando: conta('aguardando'), chegou: conta('chegou'), avisado: conta('avisado') },
    avisar: listarEncomendas({ status: 'chegou' }),
    retirar: listarEncomendas({ status: 'avisado' }),
    recentes: listarNotas().slice(0, 5),
    meses,
  };
}

async function lerNotaPorFoto(blobs) {

  }
  if (!n || n.eh_nota_fiscal === false || !Array.isArray(n.itens) || !n.itens.length) {

  }
  const num = (v) => (v === null || v === undefined || v === '' ? null : Number(v));
  const itens = n.itens.map((i, ordem) => {
    const q = num(i.quantidade) > 0 ? num(i.quantidade) : 1;
    const vu = num(i.valor_unitario) || 0;
    return {
      ordem,
      codigo: i.codigo || null,
      descricao: String(i.descricao || `Item ${ordem + 1}`),
      nome: i.nome_produto ? String(i.nome_produto).slice(0, 200) : null,
      categoria: i.categoria ? String(i.categoria).slice(0, 40) : null,
      ncm: i.ncm || null,
      quantidade: q,
      unidade: i.unidade || null,
      valor_unitario: vu,
      valor_total: num(i.valor_total) || vu * q,
    };
  });
  const soma = itens.reduce((s, i) => s + i.valor_total, 0);
  const sugestoes = new Map();
  n.itens.forEach((i, k) => Array.isArray(i.encomendas_ids) && i.encomendas_ids.length && sugestoes.set(k, i.encomendas_ids.map(String)));
  const avisos = Array.isArray(n.avisos) ? n.avisos.map(String) : [];
  const total = num(n.valor_total);
  if (total && Math.abs(total - soma - (num(n.frete) || 0) - (num(n.impostos_adicionais) || 0) - (num(n.outras_despesas) || 0) - (num(n.seguro) || 0) + (num(n.desconto) || 0)) > 0.05 && !avisos.length) {
    avisos.push('A soma dos itens não fecha com o total da nota. Confira os valores.');
  }
  return {
    nota: {
      numero: n.numero,
      serie: n.serie,
      chave: n.chave_acesso,
      emitente_nome: n.emitente_nome,
      emitente_cnpj: n.emitente_cnpj,
      data_emissao: n.data_emissao,
      valor_produtos: num(n.valor_produtos) ?? soma,
      frete: num(n.frete) || 0,
      seguro: num(n.seguro) || 0,
      desconto: num(n.desconto) || 0,
      outras: num(n.outras_despesas) || 0,
      impostos: num(n.impostos_adicionais) || 0,
      valor_total: total || soma,
      moeda: n.moeda === 'BRL' ? 'BRL' : 'USD',
      itens,
      avisos,
    },
    sugestoes,
  };
}

// Lista enviada à IA: só o produto e a quantidade (sem nome nem telefone de cliente).
const listaPendentesIA = () => pendentes().map((e) => `id ${e.id}: ${e.produto} (qtd ${e.quantidade})`);

// Para notas importadas por XML: pede à IA só os nomes claros dos produtos (não é obrigatório dar certo).
async function nomearItens(itens) {
  if (!S.sample || !LOCAL) return new Map();
  try {
    const lista = itens.map((i, k) => `${k}: ${i.descricao}`).join('\n');
    const r = await S.sample.json(`${PROMPT_NOMES}\n\nEncomendas pendentes:\n${listaPendentesIA().join('\n') || '(nenhuma)'}\n\nItens da nota:\n${lista}`, { tipo: 'nomes' });
    const sugestoes = new Map();
    for (const x of r?.itens || []) {
      const it = itens[x.indice];
      if (!it) continue;
      if (x.nome_produto) it.nome = String(x.nome_produto).slice(0, 200);
      if (x.categoria) it.categoria = String(x.categoria).slice(0, 40);
      if (Array.isArray(x.encomendas_ids) && x.encomendas_ids.length) sugestoes.set(x.indice, x.encomendas_ids.map(String));
    }
    return sugestoes;
  } catch (e) {
    console.warn('nomes não gerados', e);
    return new Map();
  }
}

// Depois da leitura rápida, um modelo mais caprichoso revisa os nomes dos produtos (em segundo plano).
async function melhorarNomes(notaId) {
  if (!S.sample || !LOCAL) return;
  const nota = S.notas.get(notaId);
  if (!nota) return;
  S.melhorando.add(notaId); agendarRender();
  try {
    const itens = (nota.itens || []).map((i) => ({ ...i }));
    const antes = itens.map((i) => i.nome);
    const sugestoes = await nomearItens(itens, { rapido: false });
    const atual = S.notas.get(notaId);
    if (!atual) return;
    const novos = (atual.itens || []).map((i) => { const m = itens.find((x) => x.id === i.id); return m && m.nome ? { ...i, nome: m.nome, categoria: m.categoria || i.categoria } : i; });
    const mudou = novos.some((i, k) => i.nome !== antes[k]);
    if (mudou) await salvarNota(notaId, { itens: novos });
    const mais = await combinarNota({ ...atual, itens: novos, id: notaId }, sugestoes);
    if (mudou || mais) toast(mais ? `Nomes revisados ✓ e mais ${mais} encomenda(s) encontrada(s)` : 'Nomes dos produtos revisados pela IA ✓');
  } catch (e) {
    console.warn('revisão de nomes falhou', e);
  } finally {
    S.melhorando.delete(notaId); agendarRender();
  }
}

// PDF → imagens (pdf.js carregado só quando precisa)
let pdfjsPromessa;
function carregarPdfJs() {
  const base = window.__PDFJS_BASE || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const script = (src) =>
    new Promise((ok, erro) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => erro(new ErroUsuario('Não consegui abrir o leitor de PDF. Tente uma foto da nota.'));
      document.head.append(s);
    });
  pdfjsPromessa ??= script(base + 'pdf.worker.min.js').then(() => script(base + 'pdf.min.js')).then(() => window.pdfjsLib);
  return pdfjsPromessa;
}

async function pdfParaImagens(file, max = 4) {
  const pdfjs = await carregarPdfJs();
  pdfjs.GlobalWorkerOptions.workerSrc = (window.__PDFJS_BASE || 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/') + 'pdf.worker.min.js';
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const paginas = [];
  for (let p = 1; p <= Math.min(doc.numPages, max); p++) {
    const pg = await doc.getPage(p);
    const vp0 = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale: Math.min(2.5, 2000 / Math.max(vp0.width, vp0.height)) });
    const cv = document.createElement('canvas');
    cv.width = vp.width;
    cv.height = vp.height;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    paginas.push(cv);
  }
  return paginas;
}

const canvasParaBlob = (cv) => new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.86));

// interface: modais, confirmações
// ============================================================
function modal(titulo, corpo, { rodape = '', largo = false } = {}) {
  const fundo = document.createElement('div');
  fundo.className = 'fundo-modal';
  fundo.innerHTML = `
    <div class="modal ${largo ? 'largo' : ''}" role="dialog" aria-modal="true">
      <div class="modal-head"><h2>${titulo}</h2><button class="btn fantasma icone" data-fechar aria-label="Fechar">${ic('x')}</button></div>
      <div class="modal-body">${corpo}</div>
      ${rodape ? `<div class="modal-foot">${rodape}</div>` : ''}
    </div>`;
  let aoFechar = null;
  const fechar = () => {
    fundo.remove();
    document.removeEventListener('keydown', teclaEsc);
    aoFechar?.();
  };
  const teclaEsc = (e) => e.key === 'Escape' && fechar();
  document.addEventListener('keydown', teclaEsc);
  fundo.addEventListener('mousedown', (e) => e.target === fundo && fechar());
  fundo.addEventListener('click', (e) => e.target.closest('[data-fechar]') && fechar());
  document.body.append(fundo);
  setTimeout(() => fundo.querySelector('[autofocus]')?.focus(), 60);
  return { el: fundo, fechar, aoFechar: (fn) => (aoFechar = fn) };
}

function confirmar(titulo, texto, { botao = 'Confirmar', perigo = false } = {}) {
  return new Promise((ok) => {
    let resp = false;
    const m = modal(titulo, `<p class="muted">${texto}</p>`, {
      rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn ${perigo ? 'perigo' : 'primario'}" data-sim>${botao}</button>`,
    });
    m.aoFechar(() => ok(resp));
    m.el.querySelector('[data-sim]').onclick = () => {
      resp = true;
      m.fechar();
    };
  });
}

let envio = [];

async function prepararArquivo(file) {
  const nome = file.name || 'arquivo';
  if (/xml/.test(file.type) || /\.xml$/i.test(nome)) return [{ nome, tipo: 'xml', texto: await file.text(), rotulo: 'XML' }];
  if (file.type === 'application/pdf' || /\.pdf$/i.test(nome)) {
    const paginas = await pdfParaImagens(file);
    return Promise.all(paginas.map(async (cv, i) => ({ nome: `${nome} p.${i + 1}`, tipo: 'image', blob: await canvasParaBlob(cv), preview: cv.toDataURL('image/jpeg', 0.6) })));
  }
  // Foto: reduz e comprime no próprio aparelho
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    bmp = await new Promise((ok, erro) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => erro(new ErroUsuario(`Não consegui abrir "${nome}". Envie em JPG ou PNG.`));
      img.src = URL.createObjectURL(file);
    });
  }
  const escala = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * escala);
  cv.height = Math.round(bmp.height * escala);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return [{ nome, tipo: 'image', blob: await canvasParaBlob(cv), preview: cv.toDataURL('image/jpeg', 0.6) }];
}

function paginaEnviar(pag) {
  const semIA = !S.sample;
  pag.innerHTML = `
    <div class="cabecalho"><div><h1>Enviar nota fiscal</h1><p class="sub">Tire uma foto da nota (ou mande o PDF/XML). Se a nota tiver mais de uma página, adicione todas.</p></div></div>

        <button class="btn primario grande" id="bt-camera">${ic('camera')} Tirar foto</button>
        <button class="btn grande" id="bt-arquivo">${ic('upload')} Escolher arquivo</button>
      </div>

  const maxFotos = S.limites?.images?.maxCount || 8;
  const adicionar = async (files) => {
    for (const f of files) {
      try {
        const partes = await prepararArquivo(f);
        if (partes[0].tipo === 'xml') envio = partes;
        else envio = envio.filter((x) => x.tipo !== 'xml').concat(partes);
      } catch (e) {
        falhou(e);
      }
    }
    if (envio.length > maxFotos) {
      envio = envio.slice(0, maxFotos);
      toast(`Máximo de ${maxFotos} fotos por nota.`, 'erro');
    }
    desenharLista();
  };

  const desenharLista = () => {
    const el = $('#lista-envio');
    if (!el) return;
    if (!envio.length) return (el.innerHTML = '');
    const temXml = envio.some((a) => a.tipo === 'xml');
    el.innerHTML = `
      <div class="card pad secao">
        <div class="linha entre"><h3>${envio.length} arquivo${envio.length > 1 ? 's' : ''} pronto${envio.length > 1 ? 's' : ''}</h3>
          ${temXml ? '' : `<button class="btn peq" id="bt-mais">${ic('mais', 'sm')} Adicionar página</button>`}</div>
        <div class="miniaturas">
          ${envio
            .map(
              (a, i) => `<div class="mini">${a.preview ? `<img src="${a.preview}" alt="Página ${i + 1}">` : `<div class="tipo">${a.rotulo}<small>${esc(a.nome)}</small></div>`}
              <button class="remover" data-rem="${i}" aria-label="Remover">${ic('x', 'sm')}</button>${envio.length > 1 ? `<span class="pag">pág. ${i + 1}</span>` : ''}</div>`,
            )
            .join('')}
        </div>
        <button class="btn primario grande bloco mt" id="bt-ler" ${!temXml && semIA ? 'disabled' : ''}>${ic('check')} ${temXml ? 'Importar nota' : 'Ler nota fiscal'}</button>
      </div>`;
    $$('[data-rem]', el).forEach((b) => (b.onclick = () => (envio.splice(Number(b.dataset.rem), 1), desenharLista())));
    $('#bt-mais', el)?.addEventListener('click', () => $('#in-camera').click());
    $('#bt-ler', el).onclick = enviar;
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };

  const enviar = async () => {
    const etapas = ['Preparando as fotos…', 'Lendo os itens…', 'Conferindo os valores…', 'Procurando encomendas dos clientes…', 'Quase lá…'];
    const ov = document.createElement('div');
    ov.className = 'lendo';
    ov.innerHTML = `<div class="caixa"><div class="spinner"></div><h2>Lendo a nota fiscal</h2><p class="etapa">${etapas[0]}</p><p class="tiny">Normalmente leva poucos segundos.</p></div>`;
    document.body.append(ov);
    let k = 0;
    const t = setInterval(() => {
      k = Math.min(k + 1, etapas.length - 1);
      $('.etapa', ov).textContent = etapas[k];
    }, 2500);
    try {
      let lido;
      let origem;
      let arquivos = [];
      const xml = envio.find((a) => a.tipo === 'xml');
      if (xml) {
        if (!ehXmlNFe(xml.texto)) throw new ErroUsuario('Este XML não é de uma NF-e.');
        const nota = { ...lerXmlNFe(xml.texto), moeda: 'BRL' };
        $('.etapa', ov).textContent = 'Identificando os produtos…';
        lido = { nota, sugestoes: await nomearItens(nota.itens) };
        origem = 'xml';
      } else {
        const blobs = envio.map((a) => a.blob);
        lido = await lerNotaPorFoto(blobs);
        origem = 'foto';
        if (S.assets) {
          $('.etapa', ov).textContent = 'Guardando a foto da nota…';
          for (const b of blobs) {
            try {
              const up = await S.assets.upload(b);
              arquivos.push({ asset_id: up.id, tipo: 'image/jpeg' });
            } catch (e) {
              console.warn('foto não guardada', e);
            }
          }
        }
      }
      $('.etapa', ov).textContent = 'Salvando…';
      const r = await criarNota(lido.nota, { origem, arquivos, sugestoes: lido.sugestoes });
      envio = [];
      S.flash = { nota: r.id, vinculadas: r.vinculadas };
      ir(`nota-${r.id}`);
      if (origem === 'foto') melhorarNomes(r.id);
    } catch (e) {
      if (e.notaId) {
        toast('Essa nota já estava cadastrada. Abrindo…');
        envio = [];
        ir(`nota-${e.notaId}`);
      } else falhou(e);
    } finally {
      clearInterval(t);
      ov.remove();
      if (S.renderPendente) render();
    }
  };

  $('#bt-camera').onclick = () => $('#in-camera').click();
  $('#bt-arquivo').onclick = () => $('#in-arquivo').click();
  $('#in-camera').onchange = (e) => (adicionar([...e.target.files]), (e.target.value = ''));
  $('#in-arquivo').onchange = (e) => (adicionar([...e.target.files]), (e.target.value = ''));
  const zona = $('#zona');
  zona.ondragover = (e) => (e.preventDefault(), zona.classList.add('arrastando'));
  zona.ondragleave = () => zona.classList.remove('arrastando');
  zona.ondrop = (e) => {
    e.preventDefault();
    zona.classList.remove('arrastando');
    adicionar([...e.dataTransfer.files]);
  };
  desenharLista();
}
